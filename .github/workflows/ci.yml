name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: '20 6 * * 1'
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make pipeline
      - run: go test -race -count=1 ./...
      - run: go mod tidy -diff
      - run: make build VERSION=ci
      - run: bin/dleplugin --help && bin/dleplugin --version
  security:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: make build VERSION=ci
      # GO-2026-5932 flags every x/crypto/openpgp package without symbols, so
      # binary mode reports it for any binary linking x/crypto (we use bcrypt
      # only). The source scan above still fails if openpgp is ever imported.
      - name: govulncheck binary
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary -format json bin/dleplugin > govulncheck.json
          jq -r 'select(.finding) | .finding.osv | select(. != "GO-2026-5932")' govulncheck.json | sort -u > findings.txt
          if [ -s findings.txt ]; then
            go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary bin/dleplugin || true
            echo "::error::vulnerabilities found: $(tr '\n' ' ' < findings.txt)"
            exit 1
          fi
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build -trimpath -o /tmp/dleplugin ./cmd/dleplugin
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
  docker:
    name: Locked PHP tool images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t dleplugin-static:ci internal/modules/static/internal/static/assets
      - run: docker run --rm dleplugin-static:ci vendor/bin/phpstan --version
      - run: docker build -t dleplugin-test:ci internal/modules/test/internal/dletest/assets
      - run: docker run --rm dleplugin-test:ci vendor/bin/pest --version
      - run: |
          docker run --rm dleplugin-test:ci php -r 'exit(phpversion("pcov") === "1.0.12" ? 0 : 1);'
