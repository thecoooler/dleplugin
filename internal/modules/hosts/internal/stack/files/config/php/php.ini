; Свои настройки PHP (поверх php.ini-development)
memory_limit = 512M
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 300
max_input_vars = 5000
date.timezone = Europe/Moscow
display_errors = On
error_reporting = E_ALL
short_open_tag = On

; opcache: проверять изменения файлов сразу (удобно для разработки)
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
