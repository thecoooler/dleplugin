# PHP version macro: "Use PHP 85" or "Use PHP 74"
<Macro PHP $ver>
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php$ver:9000"
    </FilesMatch>
</Macro>

<Directory /var/www>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ProxyTimeout 300
