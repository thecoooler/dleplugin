# Макрос выбора версии PHP: "Use PHP 85" или "Use PHP 74"
<Macro PHP $ver>
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php$ver:9000"
    </FilesMatch>
</Macro>

<Directory /var/www>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ProxyTimeout 300

# Форма входа dlehost protect; подключается из vhost защищённых хостов.
<Directory /opt/dlehost/gate>
    Options None
    AllowOverride None
</Directory>
