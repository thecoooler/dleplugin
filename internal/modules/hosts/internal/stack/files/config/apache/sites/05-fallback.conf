# The first vhost takes unknown Host values, including behind a wildcard proxy.
# Do not route them to localhost: the diagnostics page contains phpinfo().
<VirtualHost *:80>
    ServerName dleplugin.invalid
    <Location />
        Require all denied
    </Location>
    ErrorDocument 403 "Unknown host"
    ErrorLog  ${APACHE_LOG_DIR}/fallback-error.log
    CustomLog ${APACHE_LOG_DIR}/fallback-access.log combined
</VirtualHost>
