# Первый vhost принимает неизвестные Host, в том числе за wildcard proxy.
# Не направлять их в localhost: диагностическая страница содержит phpinfo().
<VirtualHost *:80>
    ServerName dlehost.invalid
    <Location />
        Require all denied
    </Location>
    ErrorDocument 403 "Unknown host"
    ErrorLog  ${APACHE_LOG_DIR}/fallback-error.log
    CustomLog ${APACHE_LOG_DIR}/fallback-access.log combined
</VirtualHost>
