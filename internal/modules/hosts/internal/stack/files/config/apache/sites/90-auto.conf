# Автохосты: папка ./www/<имя> доступна сразу по нескольким адресам:
#   http://<имя>.php74.localhost -> PHP 7.4
#   http://<имя>.php85.localhost -> PHP 8.5
#   http://<имя>.localhost       -> PHP 8.5 (по умолчанию)
# Порядок важен: более конкретные шаблоны должны идти раньше *.localhost

<Macro AutoHost $ver>
    <VirtualHost *:80>
        ServerName  php$ver.localhost
        ServerAlias *.php$ver.localhost
        UseCanonicalName Off
        VirtualDocumentRoot /var/www/%1
        Use PHP $ver
        ErrorLog  ${APACHE_LOG_DIR}/auto-error.log
        CustomLog ${APACHE_LOG_DIR}/auto-access.log combined
    </VirtualHost>
</Macro>

Use AutoHost 74
Use AutoHost 85

<VirtualHost *:80>
    ServerName  any.localhost
    ServerAlias *.localhost
    UseCanonicalName Off
    VirtualDocumentRoot /var/www/%1
    Use PHP 85
    ErrorLog  ${APACHE_LOG_DIR}/auto-error.log
    CustomLog ${APACHE_LOG_DIR}/auto-access.log combined
</VirtualHost>

UndefMacro AutoHost
